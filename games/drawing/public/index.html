<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#f5f7fc">
    <title>ارسم وخمّن</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fc;
        color: #172033;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-tap-highlight-color: transparent;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 20px 14px max(24px, env(safe-area-inset-bottom)); }
      main { width: min(100%, 860px); margin: 0 auto; }
      .header { margin: 0 0 18px; text-align: center; }
      h1 { margin: 0; font-size: clamp(1.45rem, 5vw, 2rem); line-height: 1.3; }
      .subtitle { margin: 7px 0 0; color: #637087; font-size: .96rem; }
      .card { padding: clamp(14px, 3vw, 22px); border: 1px solid #e4e9f2; border-radius: 20px; background: #fff; box-shadow: 0 12px 35px #26385b0c; }
      .word-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; padding: 13px 16px; border: 1px solid #dce7ff; border-radius: 14px; background: #f0f5ff; }
      .word-label { color: #50617d; font-size: .9rem; }
      .word { color: #1948af; font-size: 1.45rem; font-weight: 800; }
      .tools { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(150px, 1.25fr); gap: 12px; margin-bottom: 12px; }
      .control { min-width: 0; padding: 10px 12px; border: 1px solid #e4e9f2; border-radius: 13px; background: #fafbfe; }
      .control-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; color: #53617a; font-size: .86rem; font-weight: 650; }
      select { width: 100%; min-height: 42px; padding: 7px 10px; border: 1px solid #d7deea; border-radius: 9px; background: #fff; color: inherit; font: inherit; }
      input[type="range"] { width: 100%; margin: 8px 0 0; accent-color: #315ed8; }
      .size-value { min-width: 2.4em; color: #1948af; text-align: left; }
      .actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
      button { min-height: 48px; padding: 9px 10px; border: 1px solid #d7deea; border-radius: 11px; background: #fff; color: #26334b; font: inherit; font-weight: 650; cursor: pointer; touch-action: manipulation; }
      button.danger { border-color: #efcaca; background: #fff5f5; color: #a32020; }
      .cancel-row { margin-top: 10px; }
      .cancel-row button { width: 100%; }
      button:active { transform: translateY(1px); }
      button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #9db8ff; outline-offset: 2px; }
      button[aria-pressed="true"] { border-color: #315ed8; background: #eef3ff; color: #1948af; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      .canvas-wrap { overflow: hidden; border: 2px solid #d7deea; border-radius: 14px; background: #fff; }
      canvas { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; background: #fff; touch-action: none; cursor: crosshair; }
      .status-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px 16px; margin-top: 13px; padding: 13px 15px; border-radius: 13px; background: #f6f8fc; }
      #status { min-width: 0; margin: 0; color: #43516a; line-height: 1.5; }
      .timers { display: grid; gap: 4px; text-align: left; }
      .timer { color: #53617a; font-size: .82rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
      .timer strong { color: #1948af; font-size: 1rem; }
      .progress { grid-column: 1 / -1; height: 6px; overflow: hidden; border-radius: 99px; background: #e2e8f4; }
      .progress-bar { width: 100%; height: 100%; border-radius: inherit; background: #416ce0; transform: scaleX(1); transform-origin: right; transition: transform .45s linear; }
      .hint { margin: 12px 2px 0; color: #6a778d; font-size: .87rem; line-height: 1.65; }
      .error { color: #a32020 !important; }
      .success { color: #17653b !important; }
      .round-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(7, 14, 25, 0.76);
        backdrop-filter: blur(4px);
        z-index: 9999;
        padding: 24px;
        opacity: 0;
        visibility: hidden;
        transition: opacity .25s ease, visibility .25s ease;
      }
      .round-overlay.show {
        opacity: 1;
        visibility: visible;
      }
      .round-overlay-card {
        width: min(90vw, 440px);
        padding: 28px 22px 24px;
        text-align: center;
        background: linear-gradient(180deg, #ffffff 0%, #edf4ff 100%);
        border: 4px solid rgba(49, 94, 216, 0.28);
        border-radius: 28px;
        box-shadow: 0 26px 75px rgba(17, 35, 71, 0.32);
        transform: scale(.88);
        transition: transform .25s ease;
      }
      .round-overlay.show .round-overlay-card {
        transform: scale(1);
      }
      .round-overlay-title {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3rem);
        line-height: 1.15;
        color: #10224c;
      }
      .round-overlay-subtitle {
        margin: 12px 0 0;
        color: #4a5a76;
        font-size: clamp(1rem, 3vw, 1.18rem);
        line-height: 1.6;
        font-weight: 700;
      }
      @media (max-width: 520px) {
        body { padding: 12px 10px max(16px, env(safe-area-inset-bottom)); }
        .header { margin-bottom: 12px; }
        .card { padding: 12px; border-radius: 16px; }
        .word-card { margin-bottom: 10px; padding: 10px 12px; }
        .tools { gap: 8px; margin-bottom: 8px; }
        .control { padding: 8px 9px; }
        .actions { gap: 6px; margin-bottom: 8px; }
        button { min-height: 46px; padding: 8px 5px; font-size: .91rem; }
        .canvas-wrap { border-radius: 10px; }
        .status-card { margin-top: 9px; padding: 10px 11px; }
      }
      @media (max-width: 350px) {
        .tools { grid-template-columns: 1fr; }
        .actions { grid-template-columns: 1fr 1fr; }
        #eraser { grid-column: 1 / -1; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="header">
        <h1>🎨 ارسم وخمّن</h1>
        <p class="subtitle">ارسم الكلمة السرية ودع مجموعتك تخمّنها!</p>
      </header>
      <section class="card" aria-label="صفحة الرسم">
        <div class="word-card">
          <span class="word-label">الكلمة التي عليك رسمها</span>
          <span class="word" id="word"></span>
        </div>
        <div class="tools">
          <label class="control">
            <span class="control-label">لون القلم</span>
            <select id="color" aria-label="لون القلم">
              <option value="#172033">⚫ أسود</option>
              <option value="#d62828">🔴 أحمر</option>
              <option value="#2359dc">🔵 أزرق</option>
              <option value="#16834a">🟢 أخضر</option>
              <option value="#f0a000">🟠 برتقالي</option>
              <option value="#8c36b5">🟣 بنفسجي</option>
            </select>
          </label>
          <label class="control" for="size">
            <span class="control-label">حجم القلم <output class="size-value" id="sizeValue" for="size">8</output></span>
            <input id="size" type="range" min="2" max="28" value="8" aria-label="حجم القلم">
          </label>
        </div>
        <div class="actions">
          <button id="undo" type="button" aria-label="التراجع عن آخر خط" disabled>↶ تراجع</button>
          <button id="eraser" type="button" aria-pressed="false">⌫ ممحاة</button>
          <button id="clear" type="button">مسح الكل</button>
        </div>
        <div class="canvas-wrap">
          <canvas id="canvas" width="960" height="600" aria-label="مساحة الرسم. ارسم بإصبعك أو الماوس."></canvas>
        </div>
        <div class="status-card">
          <p id="status" role="status" aria-live="polite">ابدأ الرسم؛ سيُرسل تلقائياً إلى المجموعة.</p>
          <div class="timers">
            <span class="timer">الجولة: <strong id="countdown">تبدأ مع الرسم</strong></span>
            <span class="timer">الإرسال التالي: <strong id="sendCountdown">30 ث</strong></span>
          </div>
          <div class="progress" role="progressbar" aria-label="الوقت حتى الإرسال التالي" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div class="progress-bar" id="progressBar"></div>
          </div>
        </div>
        <div class="cancel-row">
          <button id="cancel" class="danger" type="button">🚫 إلغاء الجولة</button>
        </div>
        <p class="hint">ارسم بإصبعك أو بالماوس. تُرسل أحدث رسمة إلى المجموعة كل <span id="interval"></span> ثانية. اترك الصفحة مفتوحة ولا تشاركها أو تكشف الكلمة.</p>
      </section>
    </main>
    <script>
      const token = __DRAWING_TOKEN_JSON__;
      const intervalSeconds = __DRAWING_INTERVAL_SECONDS_JSON__;
      const roundDurationSeconds = 300;
      let roundEndsAt = null;
      const canvas = document.getElementById("canvas");
      const context = canvas.getContext("2d", { alpha: false });
      const status = document.getElementById("status");
      const wordLabel = document.getElementById("word");
      const countdown = document.getElementById("countdown");
      const sendCountdown = document.getElementById("sendCountdown");
      const progress = document.querySelector(".progress");
      const progressBar = document.getElementById("progressBar");
      const color = document.getElementById("color");
      const size = document.getElementById("size");
      const sizeValue = document.getElementById("sizeValue");
      const undoButton = document.getElementById("undo");
      const eraserButton = document.getElementById("eraser");
      const cancelButton = document.getElementById("cancel");
      let secretWord = __DRAWING_WORD_JSON__;
      let nextSendAt = Date.now() + intervalSeconds * 1000;
      let sending = false;
      let stopped = false;
      let waitingForTurn = false;
      let activePointerId = null;
      let activeStroke = null;
      let erasing = false;
      let strokes = [];
      let overlay = null;

      function ensureRoundOverlay() {
        if (overlay) return overlay;
        overlay = document.createElement("div");
        overlay.className = "round-overlay";

        const box = document.createElement("div");
        box.className = "round-overlay-card";

        const title = document.createElement("h2");
        title.className = "round-overlay-title";
        title.textContent = "انتهت الجولة";

        const subtitle = document.createElement("p");
        subtitle.className = "round-overlay-subtitle";
        subtitle.textContent = "يمكنك إغلاق الصفحة الآن.";

        box.appendChild(title);
        box.appendChild(subtitle);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        return overlay;
      }

      function showFinished(reason = "✅ انتهت الجولة. يمكنك إغلاق الصفحة.", cancelled = false) {
        stopped = true;
        waitingForTurn = false;
        cancelButton.disabled = true;
        status.className = "success";
        status.textContent = reason;
        countdown.textContent = "انتهت";
        sendCountdown.textContent = "—";
        const overlayNode = ensureRoundOverlay();
        const title = overlayNode.querySelector(".round-overlay-title");
        const subtitle = overlayNode.querySelector(".round-overlay-subtitle");
        const cleanReason = reason.replace(/✅|❌|⏰|⌛/g, "").trim();
        title.textContent = cancelled ? "تم إلغاء الجولة" : "انتهت الجولة";
        subtitle.textContent = "يمكنك إغلاق الصفحة الآن.";
        overlayNode.classList.add("show");
      }

      function startRoundTimer() {
        if (roundEndsAt !== null) return;
        roundEndsAt = Date.now() + roundDurationSeconds * 1000;
      }

      wordLabel.textContent = secretWord;
      document.getElementById("interval").textContent = intervalSeconds;
      size.addEventListener("input", () => {
        sizeValue.value = size.value;
        sizeValue.textContent = size.value;
      });
      color.addEventListener("change", () => {});

      function point(event) {
        const bounds = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - bounds.left) * canvas.width / bounds.width,
          y: (event.clientY - bounds.top) * canvas.height / bounds.height
        };
      }
      function paintBackground() {
        context.fillStyle = "#fff";
        context.fillRect(0, 0, canvas.width, canvas.height);
      }
      function drawStroke(stroke) {
        if (!stroke.points.length) return;
        context.beginPath();
        context.lineCap = "round";
        context.lineJoin = "round";
        context.lineWidth = stroke.width;
        context.strokeStyle = stroke.color;
        context.moveTo(stroke.points[0].x, stroke.points[0].y);
        const first = stroke.points[0];
        context.lineTo(first.x + .01, first.y + .01);
        for (let index = 1; index < stroke.points.length; index++) {
          context.lineTo(stroke.points[index].x, stroke.points[index].y);
        }
        context.stroke();
      }
      function drawSegment(from, to, stroke) {
        context.beginPath();
        context.lineCap = "round";
        context.lineJoin = "round";
        context.lineWidth = stroke.width;
        context.strokeStyle = stroke.color;
        context.moveTo(from.x, from.y);
        context.lineTo(to.x, to.y);
        context.stroke();
      }
      function redraw() {
        paintBackground();
        for (const stroke of strokes) drawStroke(stroke);
        if (activeStroke) drawStroke(activeStroke);
        undoButton.disabled = strokes.length === 0;
      }
      canvas.addEventListener("pointerdown", event => {
        startRoundTimer();
        if (activePointerId !== null) return;
        activePointerId = event.pointerId;
        canvas.setPointerCapture(event.pointerId);
        activeStroke = {
          color: erasing ? "#fff" : color.value,
          width: Number(size.value),
          points: [point(event)]
        };
        const first = activeStroke.points[0];
        drawSegment(first, { x: first.x + .01, y: first.y + .01 }, activeStroke);
      });
      canvas.addEventListener("pointermove", event => {
        if (event.pointerId !== activePointerId || !activeStroke) return;
        const next = point(event);
        const previous = activeStroke.points[activeStroke.points.length - 1];
        activeStroke.points.push(next);
        drawSegment(previous, next, activeStroke);
      });
      function finishStroke(event) {
        if (event.pointerId !== activePointerId || !activeStroke) return;
        strokes.push(activeStroke);
        activeStroke = null;
        activePointerId = null;
        redraw();
      }
      canvas.addEventListener("pointerup", finishStroke);
      canvas.addEventListener("pointercancel", finishStroke);
      canvas.addEventListener("lostpointercapture", finishStroke);
      undoButton.addEventListener("click", () => {
        if (!strokes.length) return;
        strokes.pop();
        redraw();
      });
      eraserButton.addEventListener("click", () => {
        erasing = !erasing;
        eraserButton.setAttribute("aria-pressed", String(erasing));
        eraserButton.textContent = erasing ? "✎ استخدام القلم" : "⌫ ممحاة";
      });
      document.getElementById("clear").addEventListener("click", () => {
        strokes = [];
        activeStroke = null;
        activePointerId = null;
        redraw();
      });

      function scheduleNextSend() {
        waitingForTurn = false;
        nextSendAt = Date.now() + intervalSeconds * 1000;
      }
      async function cancelDrawing() {
        if (stopped || cancelButton.disabled) return;
        if (!window.confirm("هل تريد إلغاء جولة الرسم؟")) return;
        cancelButton.disabled = true;
        status.className = "";
        status.textContent = "جارٍ إلغاء الجولة...";
        try {
          const response = await fetch("/api/draw", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, cancel: true })
          });
          const result = await response.json();
          if (response.status === 410 || result.state === "finished") {
            showFinished("انتهت الجولة بالفعل.");
            return;
          }
          if (!response.ok || result.state !== "cancelled") {
            throw new Error(result.error || "تعذر إلغاء الجولة.");
          }
          showFinished("🚫 تم إلغاء جولة الرسم.", true);
        } catch (error) {
          cancelButton.disabled = false;
          status.className = "error";
          status.textContent = "❌ " + error.message;
        }
      }
      cancelButton.addEventListener("click", cancelDrawing);
      async function pollStatus() {
        if (sending || stopped) return;
        sending = true;
        let nextAction = null;
        try {
          const response = await fetch("/api/draw", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, statusOnly: true })
          });
          const result = await response.json();
          if (stopped) return;
          if (response.status === 410) {
            showFinished("⌛ انتهت الجولة. يمكنك إغلاق الصفحة.");
            return;
          }
          if (!response.ok) throw new Error(result.error || "تعذر متابعة الجولة.");
          if (result.state === "finished") {
            showFinished("✅ انتهت الجولة. يمكنك إغلاق الصفحة.");
            return;
          }
          if (result.state === "ready") {
            waitingForTurn = false;
            nextSendAt = Date.now();
            nextAction = "send";
          } else {
            nextSendAt = Date.now() + 3000;
          }
        } catch (error) {
          if (stopped) return;
          status.className = "error";
          status.textContent = "❌ " + error.message;
          nextSendAt = Date.now() + 10000;
        } finally {
          sending = false;
        }
        if (nextAction === "send") sendDrawing();
      }
      async function sendDrawing() {
        if (sending || stopped) return;
        sending = true;
        status.className = "";
        status.textContent = "جارٍ إرسال أحدث رسمة...";
        try {
          const response = await fetch("/api/draw", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, image: canvas.toDataURL("image/png") })
          });
          const result = await response.json();
          if (stopped) return;
          if (response.status === 410) {
            showFinished("⌛ انتهت الجولة. يمكنك إغلاق الصفحة.");
            return;
          }
          if (!response.ok) throw new Error(result.error || "تعذر إرسال الرسمة.");
          if (result.state === "finished") {
            showFinished("✅ انتهت الجولة. يمكنك إغلاق الصفحة.");
            return;
          }
          if (result.state === "queued") {
            status.className = "success";
            status.textContent = "✅ وصلت رسمة جديدة إلى المجموعة.";
            scheduleNextSend();
          } else {
            status.textContent = "⏳ وصلت الرسمة؛ انتظر دورك وسيُرسل آخر تحديث تلقائياً.";
            waitingForTurn = true;
            nextSendAt = Date.now() + 3000;
          }
        } catch (error) {
          if (stopped) return;
          status.className = "error";
          status.textContent = "❌ " + error.message;
          nextSendAt = Date.now() + 10000;
        } finally {
          sending = false;
        }
      }
      setInterval(() => {
        if (stopped) return;
        const now = Date.now();
        const remainingMs = Math.max(0, nextSendAt - Date.now());
        const remaining = Math.ceil(remainingMs / 1000);
        if (roundEndsAt === null) {
          countdown.textContent = "تبدأ مع الرسم";
          countdown.setAttribute("aria-label", "تبدأ مدة الجولة عند بدء الرسم");
        } else {
          const roundRemainingMs = Math.max(0, roundEndsAt - now);
          const roundRemaining = Math.ceil(roundRemainingMs / 1000);
          countdown.textContent = `${roundRemaining} ث`;
          countdown.setAttribute("aria-label", `بقي ${roundRemaining} ثانية في الجولة`);
        }
        sendCountdown.textContent = sending
          ? "جارٍ الإرسال"
          : waitingForTurn
            ? `فحص الدور خلال ${remaining} ث`
            : `${remaining} ث`;
        sendCountdown.setAttribute(
          "aria-label",
          sending
            ? "جارٍ إرسال الرسمة"
            : waitingForTurn
              ? `فحص دور الإرسال خلال ${remaining} ثانية`
              : `الإرسال التالي خلال ${remaining} ثانية`,
        );
        const sendProgress = Math.max(0, Math.min(1, remainingMs / (intervalSeconds * 1000)));
        progress.setAttribute("aria-valuenow", String(Math.round(sendProgress * 100)));
        progressBar.style.transform = `scaleX(${sendProgress})`;
        if (remaining === 0) {
          if (waitingForTurn) pollStatus();
          else sendDrawing();
        }
      }, 500);
    </script>
  </body>
</html>
